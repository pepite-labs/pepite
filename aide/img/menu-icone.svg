<rect x="0" y="330" width="640" height="70" fill="#F3F5F8"/>
<rect x="256" y="14" width="276" height="314" rx="12" fill="#fff" stroke="#C9CFD8" stroke-width="2"/>
<text x="290" y="50" font-size="24" fill="#222">Pause</text><line x1="276" y1="78" x2="514" y2="78" stroke="#E2E6EC" stroke-width="2"/><text x="290" y="102" font-size="24" fill="#222">Ajouter un mot…</text><text x="290" y="148" font-size="24" fill="#222">Réglages…</text><rect x="266" y="164" width="256" height="42" rx="8" fill="#FFF1D6" stroke="#E8A64B" stroke-width="2"/><text x="290" y="194" font-size="24" font-weight="700" fill="#4A2C1D">Aide</text><text x="290" y="240" font-size="24" fill="#222">À propos…</text><text x="290" y="286" font-size="24" fill="#222">Quitter</text>
