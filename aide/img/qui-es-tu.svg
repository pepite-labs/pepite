<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Dessin de la fenêtre Qui es-tu ? : une grande case par élève, avec son image et son prénom (Léa, Noah, Inès, Sami). La case de Léa est choisie. En bas, le bouton C'est moi.</title>

<rect width="720" height="360" rx="18" fill="#FBEBD0"/>
<text x="360" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#4A2C1D">Qui es-tu ?</text>
<rect x="40" y="90" width="145" height="170" rx="14" fill="#fff" stroke="#1565C0" stroke-width="8"/><circle cx="112" cy="155" r="44" fill="#1565C0"/><text x="112" y="171" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">L</text><text x="112" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Léa</text><rect x="205" y="90" width="145" height="170" rx="14" fill="#fff" stroke="#2E7D32" stroke-width="5"/><circle cx="277" cy="155" r="44" fill="#2E7D32"/><text x="277" y="171" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">N</text><text x="277" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Noah</text><rect x="370" y="90" width="145" height="170" rx="14" fill="#fff" stroke="#C62828" stroke-width="5"/><circle cx="442" cy="155" r="44" fill="#C62828"/><text x="442" y="171" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">I</text><text x="442" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Inès</text><rect x="535" y="90" width="145" height="170" rx="14" fill="#fff" stroke="#6A1B9A" stroke-width="5"/><circle cx="607" cy="155" r="44" fill="#6A1B9A"/><text x="607" y="171" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">S</text><text x="607" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Sami</text>
<rect x="270" y="286" width="180" height="48" rx="8" fill="#E8F0FC" stroke="#2D7DD2" stroke-width="3"/>
<text x="360" y="318" text-anchor="middle" font-size="24" font-weight="700" fill="#222">C'est moi ✓</text>
</svg>
