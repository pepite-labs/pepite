# The online help of Pépite on GitHub Pages (plan 13, A10): https://pepite-labs.github.io/pepite/
# One folder per minor version (<x.y>/aide/...), "/" redirects to the latest one. The help pages are those of aide/,
# with a banner « Aide en ligne de Pépite <x.y> » and a privacy line (installer/build_help_site.py); help_lint runs on
# the built site. Independent of the installer build, so it can go live right after the first public push.
#   workflow_dispatch (branch main): builds the "minor" folder from main (it must be the csproj's minor version);
#   a v<x.y.z> tag: builds that tag's minor folder.
# Every other minor folder is rebuilt from the latest published release tag of that minor (Pages deployments replace
# the whole site). The fonts come from the data release. Environment "github-pages": the owner approves each run.
# Every action is GitHub-owned and pinned to a full commit SHA (organisation rule), its tag in the comment.
name: pages

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      minor:
        description: 'Minor version folder built from this branch (x.y, the csproj Version)'
        type: string
        default: '0.10'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.9'
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
          MINOR_INPUT: ${{ inputs.minor }}
        run: |
          set -euo pipefail
          version=$(grep -oE '<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>' src/Predict.Keyboard/Predict.Keyboard.csproj \
            | head -n 1 | sed -E 's#</?Version>##g')
          current=${version%.*}
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$MINOR_INPUT" != "$current" ]; then
            echo "::error::input minor $MINOR_INPUT is not the csproj minor $current of $GITHUB_REF_NAME"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the csproj Version $version"; exit 1
          fi
          fonts=$(jq -r '.assets[].name | select(startswith("fonts-"))' src/Data.Build/data-release.lock.json)
          python -I src/Data.Build/fetch_data_release.py --cache "$RUNNER_TEMP/data-cache" --out "$RUNNER_TEMP/data-out" \
            --only "$fonts"
          args=(--version "$current=$GITHUB_WORKSPACE")
          minors=("$current")
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName --jq '.[].tagName' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V > "$RUNNER_TEMP/tags.txt"
          for minor in $(sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/' "$RUNNER_TEMP/tags.txt" | sort -uV); do
            [ "$minor" = "$current" ] && continue
            tag=$(grep -E "^v${minor//./\\.}\." "$RUNNER_TEMP/tags.txt" | tail -n 1)
            dir="$RUNNER_TEMP/help-src/$minor"
            mkdir -p "$dir"
            git archive "$tag" | tar -x -C "$dir"
            args+=(--version "$minor=$dir")
            minors+=("$minor")
          done
          latest=$(printf '%s\n' "${minors[@]}" | sort -V | tail -n 1)
          python -I installer/build_help_site.py --out "$RUNNER_TEMP/site" --fonts "$RUNNER_TEMP/data-out/fonts" \
            --latest "$latest" "${args[@]}"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
