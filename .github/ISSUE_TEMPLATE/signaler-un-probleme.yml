name: Signaler un problème
description: Pépite ne fonctionne pas comme prévu.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **N'indiquez aucune donnée d'élève** : pas de nom, pas de texte écrit par un élève, pas de profil `.pepite`, pas de journal `--log` ni de capture d'écran qui en montrent. Utilisez des exemples inventés.
  - type: checkboxes
    id: donnees
    attributes:
      label: Données d'élèves
      options:
        - label: Ce ticket ne contient aucune donnée d'élève.
          required: true
  - type: input
    id: version
    attributes:
      label: Version de Pépite
      description: Menu de l'icône → À propos.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: Windows 11 24H2
  - type: input
    id: application
    attributes:
      label: Application dans laquelle vous écriviez
      placeholder: Bloc-notes, Word, Edge…
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. J'ouvre le Bloc-notes\n2. Je tape « la maiz »\n3. …"
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez et ce qui s'est passé
    validations:
      required: true
