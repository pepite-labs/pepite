<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Le rond à gauche des mots. Coche verte : mot connu. Signe environ bleu : le mot s'écrit peut-être autrement. Point d'interrogation rouge : mot inconnu. Il n'y a jamais de croix.</title>
<rect width="880" height="320" rx="18" fill="#FBEBD0"/><rect x="20" y="15" width="840" height="86" rx="14" fill="#fff"/><rect x="40" y="25" width="240" height="66" rx="10" fill="#1F2937"/><circle cx="80" cy="58" r="24" fill="#2E9E5B"/><text x="80" y="69" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">✓</text><text x="120" y="69" font-family="Consolas, monospace" font-size="28" fill="#fff">maison</text><text x="305" y="69" font-size="27" font-weight="600" fill="#2B1B12">mot connu</text><rect x="20" y="117" width="840" height="86" rx="14" fill="#fff"/><rect x="40" y="127" width="240" height="66" rx="10" fill="#1F2937"/><circle cx="80" cy="160" r="24" fill="#2D7DD2"/><text x="80" y="171" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">≈</text><text x="120" y="171" font-family="Consolas, monospace" font-size="28" fill="#fff">maizon</text><text x="305" y="171" font-size="27" font-weight="600" fill="#2B1B12">s'écrit peut-être autrement</text><rect x="20" y="219" width="840" height="86" rx="14" fill="#fff"/><rect x="40" y="229" width="240" height="66" rx="10" fill="#1F2937"/><circle cx="80" cy="262" r="24" fill="#C62828"/><text x="80" y="273" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">?</text><text x="120" y="273" font-family="Consolas, monospace" font-size="28" fill="#fff">zorbi</text><text x="305" y="273" font-size="27" font-weight="600" fill="#2B1B12">mot inconnu</text>
</svg>
