ill="#2B1B12">▶</text><text x="118" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#2B1B12">⏮</text><text x="180" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#2B1B12">⏭</text><text x="242" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#2B1B12">⤢</text><text x="290" y="150" font-size="22" font-weight="600" fill="#2B1B12">le mot lu est en jaune</text>
