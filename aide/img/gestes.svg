<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Quatre gestes. Les touches F1 à F8 : choisir un mot. Un clic : choisir le mot. Un clic droit : écouter le mot. La touche Échap : cacher la barre.</title>
<g transform="translate(0,0)"><rect width="200" height="250" rx="16" fill="#fff"/><rect x="50" y="40" width="100" height="100" rx="14" fill="#fff" stroke="#5A4636" stroke-width="4"/><rect x="50" y="120" width="100" height="20" rx="8" fill="#D9C4AA"/><text x="100" y="100" text-anchor="middle" font-size="40" font-weight="700" fill="#2D7DD2">F1</text><text x="100" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#4A2C1D">F1 … F8</text><text x="100" y="230" text-anchor="middle" font-size="20" fill="#5A4636">choisir le mot</text></g><g transform="translate(226,0)"><rect width="200" height="250" rx="16" fill="#fff"/><rect x="64" y="40" width="72" height="112" rx="36" fill="#F3F5F8"/><path d="M64 40 h36 v44 h-36 z" fill="#E8A64B"/><line x1="100" y1="40" x2="100" y2="84" stroke="#5A4636" stroke-width="4"/><line x1="64" y1="84" x2="136" y2="84" stroke="#5A4636" stroke-width="4"/><rect x="64" y="40" width="72" height="112" rx="36" fill="none" stroke="#5A4636" stroke-width="4"/><text x="100" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#4A2C1D">Clic</text><text x="100" y="230" text-anchor="middle" font-size="20" fill="#5A4636">choisir le mot</text></g><g transform="translate(452,0)"><rect width="200" height="250" rx="16" fill="#fff"/><rect x="64" y="40" width="72" height="112" rx="36" fill="#F3F5F8"/><path d="M100 40 h36 v44 h-36 z" fill="#E8A64B"/><line x1="100" y1="40" x2="100" y2="84" stroke="#5A4636" stroke-width="4"/><line x1="64" y1="84" x2="136" y2="84" stroke="#5A4636" stroke-width="4"/><rect x="64" y="40" width="72" height="112" rx="36" fill="none" stroke="#5A4636" stroke-width="4"/><path d="M150 70 q14 26 0 52 M164 60 q22 36 0 72" fill="none" stroke="#2E9E5B" stroke-width="5" stroke-linecap="round"/><text x="100" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#4A2C1D">Clic droit</text><text x="100" y="230" text-anchor="middle" font-size="20" fill="#5A4636">écouter le mot</text></g><g transform="translate(678,0)"><rect width="200" height="250" rx="16" fill="#fff"/><rect x="50" y="40" width="100" height="100" rx="14" fill="#fff" stroke="#5A4636" stroke-width="4"/><rect x="50" y="120" width="100" height="20" rx="8" fill="#D9C4AA"/><text x="100" y="96" text-anchor="middle" font-size="26" font-weight="700" fill="#D97B16">Échap</text><text x="100" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#4A2C1D">Échap</text><text x="100" y="230" text-anchor="middle" font-size="20" fill="#5A4636">cacher la barre</text></g>
</svg>
