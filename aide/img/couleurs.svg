<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Les trois couleurs de la barre. Bleu : tu écris mai, Pépite propose maison, la suite du mot. Vert : tu écris orizon, Pépite propose horizon, le même son. Orange : tu écris chein, Pépite propose chien, des lettres inversées.</title>
<rect width="880" height="330" rx="18" fill="#FBEBD0"/><rect x="20" y="30" width="210" height="72" rx="10" fill="#fff" stroke="#8A7055" stroke-width="2"/><text x="40" y="77" font-family="Consolas, monospace" font-size="30" fill="#2B1B12">mai</text><path d="M250 66 h70 m-16 -14 l16 14 l-16 14" fill="none" stroke="#5A4636" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="26" width="200" height="80" rx="10" fill="#2D7DD2"/><text x="440.0" y="76.66666666666667" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">maison</text><text x="565" y="76" font-size="27" font-weight="600" fill="#2B1B12">la suite du mot</text><rect x="20" y="130" width="210" height="72" rx="10" fill="#fff" stroke="#8A7055" stroke-width="2"/><text x="40" y="177" font-family="Consolas, monospace" font-size="30" fill="#2B1B12">orizon</text><path d="M250 166 h70 m-16 -14 l16 14 l-16 14" fill="none" stroke="#5A4636" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="126" width="200" height="80" rx="10" fill="#2E9E5B"/><text x="440.0" y="176.66666666666666" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">horizon</text><text x="565" y="176" font-size="27" font-weight="600" fill="#2B1B12">le même son</text><rect x="20" y="230" width="210" height="72" rx="10" fill="#fff" stroke="#8A7055" stroke-width="2"/><text x="40" y="277" font-family="Consolas, monospace" font-size="30" fill="#2B1B12">chein</text><path d="M250 266 h70 m-16 -14 l16 14 l-16 14" fill="none" stroke="#5A4636" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="226" width="200" height="80" rx="10" fill="#D97B16"/><text x="440.0" y="276.6666666666667" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">chien</text><text x="565" y="276" font-size="27" font-weight="600" fill="#2B1B12">lettres inversées</text>
</svg>
