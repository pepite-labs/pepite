<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Un clic sur l'icône biscuit ouvre le menu de Pépite : Pause, Ajouter un mot…, Réglages…, Aide, À propos…, Quitter. L'élément Aide est mis en avant.</title>

