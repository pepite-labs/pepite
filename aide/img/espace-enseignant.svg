<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Dessin de l'Espace enseignant. Cinq onglets : Profils, Verrouillage, Code, Exporter / importer et Mots. Dans l'onglet Profils, la liste Classe, Léa, Noah, Inès, et les boutons Ajouter…, Nom et image…, Modifier les réglages…, Utiliser maintenant.</title>

<rect width="720" height="360" rx="18" fill="#FBEBD0"/>
<rect x="20" y="20" width="680" height="320" rx="10" fill="#fff" stroke="#C9CFD8" stroke-width="2"/>
<rect x="20" y="20" width="680" height="34" rx="10" fill="#F3F4F6"/>
<text x="40" y="44" font-size="18" fill="#333">Espace enseignant — Pépite</text>
<rect x="36" y="64" width="103" height="34" rx="4" fill="#fff" stroke="#9CA3AF" stroke-width="2"/><text x="87.5" y="88" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Profils</text><rect x="143" y="64" width="158" height="34" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="222.0" y="88" text-anchor="middle" font-size="19" fill="#222">Verrouillage</text><rect x="305" y="64" width="70" height="34" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="340.0" y="88" text-anchor="middle" font-size="19" fill="#222">Code</text><rect x="379" y="64" width="235" height="34" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="496.5" y="88" text-anchor="middle" font-size="19" fill="#222">Exporter / importer</text><rect x="618" y="64" width="70" height="34" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="653.0" y="88" text-anchor="middle" font-size="19" fill="#222">Mots</text><rect x="44" y="120" width="300" height="36" rx="4" fill="#fff" stroke="#E5E7EB"/><circle cx="64" cy="138" r="11" fill="#8D6E63"/><text x="86" y="145" font-size="19" fill="#222">Classe</text><rect x="44" y="162" width="300" height="36" rx="4" fill="#E8F0FC" stroke="#E5E7EB"/><circle cx="64" cy="180" r="11" fill="#1565C0"/><text x="86" y="187" font-size="19" fill="#222">Léa</text><rect x="44" y="204" width="300" height="36" rx="4" fill="#fff" stroke="#E5E7EB"/><circle cx="64" cy="222" r="11" fill="#2E7D32"/><text x="86" y="229" font-size="19" fill="#222">Noah</text><rect x="44" y="246" width="300" height="36" rx="4" fill="#fff" stroke="#E5E7EB"/><circle cx="64" cy="264" r="11" fill="#C62828"/><text x="86" y="271" font-size="19" fill="#222">Inès</text><rect x="370" y="120" width="230" height="34" rx="5" fill="#F3F4F6" stroke="#9CA3AF"/><text x="485" y="143" text-anchor="middle" font-size="18" fill="#222">Ajouter…</text><rect x="370" y="162" width="230" height="34" rx="5" fill="#F3F4F6" stroke="#9CA3AF"/><text x="485" y="185" text-anchor="middle" font-size="18" fill="#222">Nom et image…</text><rect x="370" y="204" width="230" height="34" rx="5" fill="#F3F4F6" stroke="#9CA3AF"/><text x="485" y="227" text-anchor="middle" font-size="18" fill="#222">Modifier les réglages…</text><rect x="370" y="246" width="230" height="34" rx="5" fill="#F3F4F6" stroke="#9CA3AF"/><text x="485" y="269" text-anchor="middle" font-size="18" fill="#222">Utiliser maintenant</text>
