# Build, test and release Pépite (plan 13, A4). Every action is a GitHub-owned action pinned to a full commit SHA
# (organisation rule); the tag of each pin is in the comment next to it.
#   test       every pull request, push to main and tag: build Pepite.sln, dotnet test without the « Timing » tests, the
#              Python suites (the required check)
#   installer  a v<x.y.z> tag, or a manual run with "installer": the data release, the VC++ runtime, Inno Setup, then
#              build_installer.ps1 -NoForbiddenList (the forbidden-term list never comes to GitHub: the owner's local
#              rebuild from the tag runs the full lint before publishing); artifact kept 14 days: approve the
#              "release" environment within 14 days, else re-run the workflow
#   smoke      silent install / check / uninstall of that installer on the disposable runner
#   release    tags only, environment "release" (owner approval): SHA256SUMS check, build-provenance attestation,
#              French release notes, a DRAFT pre-release with every asset uploaded (immutable releases: published by
#              the owner after his checks)
# The .NET SDK is exactly the one global.json pins (rollForward: disable; checked after setup-dotnet): its patch fixes
# the runtime packs of the self-contained publish, which THIRD-PARTY-NOTICES.txt and the owner's local rebuild match.
# The version is passed in PEPITE_VERSION, never in VERSION: MSBuild reads every environment variable as a property
# (case-insensitive), so a VERSION variable became the Version of every project without its own (Predict.Core 0.10.1 in
# the 0.10.1 CI build, 1.0.0 locally); build_installer.ps1 also refuses to build while VERSION (or another version
# property) is set in the environment.
# The online help (GitHub Pages) has its own workflow, pages.yml.
name: app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      installer:
        description: 'Also build the installer and run the smoke test (no release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHON_VERSION: '3.12.9'

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: SDK is exactly the global.json one
        shell: pwsh
        run: |
          $want = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $got = (dotnet --version | Out-String).Trim()
          if ($got -ne $want) { throw "dotnet --version is '$got', global.json pins '$want'" }
          "SDK $got"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # the word base and the « Noms propres » pack (pack 2026.3: its real-pack picture test needs it under PEPITE_REQUIRE_DATA)
      - name: Word base and names pack (data release)
        shell: pwsh
        run: |
          $pack = (Get-Content src/Data.Build/data-pack.lock.json -Raw | ConvertFrom-Json).pack.version
          $noms = ((Get-Content src/Data.Build/data-release.lock.json -Raw | ConvertFrom-Json).assets | Where-Object { $_.unpack_to -eq 'noms-pack' }).name
          if (-not $noms) { Write-Error 'data-release.lock.json: no asset unpacks to noms-pack'; exit 1 }
          python -I src/Data.Build/fetch_data_release.py --cache "$env:RUNNER_TEMP/data-cache" --only "pepite-data-$pack.zip" --only "$noms"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Mots exclus (out/exclusions from the committed, reviewed list; plan offensive-words)
        shell: pwsh
        run: |
          python -I src/Data.Build/exclusions/build_exclusions.py ship --out-dir src/Data.Build/out/exclusions `
            --db src/Data.Build/out/prediction.sqlite --grammar src/Data.Build/out/grammar.sqlite
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build
        run: dotnet build Pepite.sln -c Release -nologo
      # the tests marked [Trait("Category", "Timing")] (background threads, timeouts, wall-clock bounds) do not run on the
      # shared runner (owner, 2026-11-18): the export gate runs every test locally before each push (BUILD.md § 2a)
      - name: .NET tests
        # the tests on the real data (word base, grammar, mots exclus) fail instead of skipping when a file is missing
        env:
          PEPITE_REQUIRE_DATA: '1'
        run: dotnet test Pepite.sln -c Release --no-build -nologo --filter "Category!=Timing"
      - name: Python suites and help lint
        shell: pwsh
        run: |
          $suites = @(@('src/Data.Build/corpus/tests', 'test*.py'), @('src/Data.Build', 'test_*.py'),
                      @('src/Data.Build/pepite-noms/tests', 'test*.py'), @('src/Data.Build/exclusions/tests', 'test*.py'),
                      @('installer/tests', 'test_*.py'))
          foreach ($s in $suites) {
            Push-Location $s[0]
            python -I -m unittest discover -s . -p $s[1]
            $rc = $LASTEXITCODE
            Pop-Location
            if ($rc) { throw "Python suite $($s[0]) failed" }
          }
          python -I installer/help_lint.py aide
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  installer:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.installer)
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: SDK is exactly the global.json one
        shell: pwsh
        run: |
          $want = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $got = (dotnet --version | Out-String).Trim()
          if ($got -ne $want) { throw "dotnet --version is '$got', global.json pins '$want'" }
          "SDK $got"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Version (the tag must equal the csproj Version)
        id: version
        shell: pwsh
        run: |
          [xml]$p = Get-Content src/Predict.Keyboard/Predict.Keyboard.csproj -Raw
          $v = @($p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "csproj Version '$v' is not x.y.z" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match the csproj Version $v"
          }
          if (-not (Test-Path "installer/notes/$v.txt")) { throw "installer/notes/$v.txt missing" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Data release
        shell: pwsh
        run: |
          python -I src/Data.Build/fetch_data_release.py --cache "$env:RUNNER_TEMP/data-cache"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Mots exclus (out/exclusions from the committed, reviewed list; plan offensive-words)
        shell: pwsh
        run: |
          python -I src/Data.Build/exclusions/build_exclusions.py ship --out-dir src/Data.Build/out/exclusions `
            --db src/Data.Build/out/prediction.sqlite --grammar src/Data.Build/out/grammar.sqlite
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Visual C++ runtime (app-local)
        shell: pwsh
        run: ./src/Data.Build/stage_vcruntime.ps1
      - name: Inno Setup
        shell: pwsh
        run: ./installer/fetch_innosetup.ps1 -WorkDir "$env:RUNNER_TEMP/work"
      - name: Build the installer
        shell: pwsh
        env:
          PEPITE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ec = (Get-Content src/Data.Build/espeak-ng.lock.json -Raw | ConvertFrom-Json).espeak.commit
          ./installer/build_installer.ps1 -Version $env:PEPITE_VERSION -WorkDir "$env:RUNNER_TEMP/work" `
            -NoForbiddenList -OldRelease '' -EspeakSourceArchive "$env:RUNNER_TEMP/data-cache/espeak-ng-$ec.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/work/release-${{ steps.version.outputs.version }}/
          retention-days: 14          # the release job (owner approval) must start within 14 days
          if-no-files-found: error

  smoke:
    needs: installer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ needs.installer.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Install, check, uninstall
        shell: pwsh
        env:
          PEPITE_VERSION: ${{ needs.installer.outputs.version }}
        run: |
          ./installer/tests/Smoke-PepiteInstall.ps1 -Release "$env:RUNNER_TEMP/release" `
            -Version $env:PEPITE_VERSION -Out "$env:RUNNER_TEMP/smoke" -SpeechBench `
            -Sentences development/voice-test/sentences.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-logs-${{ needs.installer.outputs.version }}
          path: ${{ runner.temp }}/smoke/
          retention-days: 3
          if-no-files-found: ignore

  release:
    needs: [installer, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write        # gh release create
      id-token: write        # attestation (Sigstore certificate)
      attestations: write
    env:
      PEPITE_VERSION: ${{ needs.installer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ needs.installer.outputs.version }}
          path: dist
      - name: Assets and SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          src=$(ls espeak-ng-*.tar.gz)
          assets=("Pepite-$PEPITE_VERSION-installation.exe" SHA256SUMS.txt LISEZ-MOI.txt DEPLOIEMENT.txt exemple-etablissement.json
                  "symbols-$PEPITE_VERSION.zip" "$src" BUILD-INFO.txt files.sha256 signatures.txt)
          sha256sum -c --strict SHA256SUMS.txt
          for f in "${assets[@]}"; do
            [ -f "$f" ] || { echo "::error::asset $f missing"; exit 1; }
            [ "$f" = SHA256SUMS.txt ] || grep -qxF "$(sha256sum "$f" | cut -d' ' -f1) *$f" SHA256SUMS.txt \
              || { echo "::error::$f is not in SHA256SUMS.txt"; exit 1; }
          done
          [ "$(wc -l < SHA256SUMS.txt)" -eq $(( ${#assets[@]} - 1 )) ] || { echo "::error::SHA256SUMS.txt lists other files"; exit 1; }
          printf '%s\n' "${assets[@]}" > ../assets.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/Pepite-${{ needs.installer.outputs.version }}-installation.exe
            dist/symbols-${{ needs.installer.outputs.version }}.zip
      - name: Release notes
        run: python -I installer/release_notes.py --version "$PEPITE_VERSION" --sums dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --out notes.md
      - name: Draft pre-release (every asset uploaded while it is a draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < assets.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
            --title "Pépite $PEPITE_VERSION — version de test" --notes-file notes.md "${assets[@]/#/dist/}"
