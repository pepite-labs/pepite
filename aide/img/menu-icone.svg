<g><circle cx="394.0" cy="366.0" r="17.0" fill="#E8A64B"/><circle cx="394.0" cy="366.0" r="13.9" fill="#F2BC66"/><circle cx="409.5" cy="352.1" r="6.6" fill="#FFE9B8"/><circle cx="387.8" cy="361.4" r="3.3" fill="#4A2C1D"/><circle cx="397.1" cy="371.4" r="3.7" fill="#4A2C1D"/><circle cx="386.3" cy="373.0" r="2.3" fill="#4A2C1D"/><circle cx="397.9" cy="359.8" r="2.1" fill="#4A2C1D"/><rect x="401.7" y="363.7" width="2.3" height="7.7" rx="1.2" fill="#4A2C1D"/></g>
<text x="560" y="372" text-anchor="middle" font-size="22" fill="#222">14:32</text>
<text x="40" y="200" font-size="24" font-weight="700" fill="#4A2C1D">Un clic</text>
